name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + eval safety gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Run the deterministic test suite (offline)
        run: pytest -q

      # The eval harness exits non-zero on any unsafe approval. The finished
      # agent (v4.1+) must pass with zero unsafe approvals; this is the safety
      # gate the book argues every change should be measured against.
      - name: Eval safety gate (finished agent, fake mode)
        run: PYTHONPATH=src python -m medguard.eval.run --agent v41 --fake
